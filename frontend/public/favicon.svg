<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0714" />
      <stop offset="1" stop-color="#050308" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#d946ef" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#a78bfa" stroke-opacity="0.15" />
  
  <!-- Glowing Spherical Network -->
  <g transform="translate(32, 32)">
    <!-- Outer Sphere Rings (Concentric Ellipses) -->
    <ellipse cx="0" cy="0" rx="20" ry="20" stroke="url(#primary-grad)" stroke-width="2.5" stroke-opacity="0.85" />
    <ellipse cx="0" cy="0" rx="20" ry="7" stroke="url(#primary-grad)" stroke-width="1.5" stroke-dasharray="2 3" stroke-opacity="0.5" />
    <ellipse cx="0" cy="0" rx="7" ry="20" stroke="url(#primary-grad)" stroke-width="1.5" stroke-dasharray="2 3" stroke-opacity="0.5" stroke-linecap="round" />
    
    <!-- Central Node -->
    <circle cx="0" cy="0" r="3.5" fill="#fdf4ff" />
    <circle cx="0" cy="0" r="6" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.8" />
    
    <!-- Connected Satellite Nodes -->
    <circle cx="-14" cy="-14" r="2.5" fill="#a78bfa" />
    <line x1="0" y1="0" x2="-14" y2="-14" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.6" />
    
    <circle cx="14" cy="-14" r="2.5" fill="#a78bfa" />
    <line x1="0" y1="0" x2="14" y2="-14" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.6" />
    
    <circle cx="-18" cy="8" r="2.5" fill="#d946ef" />
    <line x1="0" y1="0" x2="-18" y2="8" stroke="#d946ef" stroke-width="1" stroke-opacity="0.6" />
    
    <circle cx="18" cy="8" r="2.5" fill="#d946ef" />
    <line x1="0" y1="0" x2="18" y2="8" stroke="#d946ef" stroke-width="1" stroke-opacity="0.6" />
    
    <circle cx="0" cy="18" r="2.5" fill="#8b5cf6" />
    <line x1="0" y1="0" x2="0" y2="18" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />

    <circle cx="0" cy="-18" r="2.5" fill="#8b5cf6" />
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />
  </g>
</svg>
