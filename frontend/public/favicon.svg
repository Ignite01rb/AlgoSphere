<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    :root {
      --primary-color: hsl(36, 96%, 48%);
      --gradient-mid: hsl(36, 96%, 48% / 0.85);
      --gradient-stop: hsl(36, 96%, 48% / 0.4);
      --fg-color: hsl(30, 50%, 4%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary-color: hsl(37, 90%, 55%);
        --gradient-mid: hsl(37, 90%, 55% / 0.85);
        --gradient-stop: hsl(37, 90%, 55% / 0.4);
        --fg-color: hsl(35, 20%, 96%);
      }
    }
  </style>
  <defs>
    <linearGradient id="tabLogoGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--primary-color)" />
      <stop offset="0.5" stop-color="var(--gradient-mid)" />
      <stop offset="1" stop-color="var(--gradient-stop)" />
    </linearGradient>
    <filter id="tabLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="12" cy="12" r="10" stroke="url(#tabLogoGrad)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.3" />
  <path d="M12 2C16 5.5 16 18.5 12 22" stroke="url(#tabLogoGrad)" stroke-width="1" opacity="0.4" />
  <path d="M12 2C8 5.5 8 18.5 12 22" stroke="url(#tabLogoGrad)" stroke-width="1" opacity="0.4" />
  <line x1="2" y1="12" x2="22" y2="12" stroke="url(#tabLogoGrad)" stroke-width="1" opacity="0.4" />
  <path d="M12 7 L17 12 L12 17 L7 12 Z" stroke="url(#tabLogoGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M12 2 L12 22" stroke="url(#tabLogoGrad)" stroke-width="1" />
  <circle cx="12" cy="12" r="2.5" fill="url(#tabLogoGrad)" filter="url(#tabLogoGlow)" />
  <circle cx="12" cy="7" r="1.2" fill="var(--fg-color)" />
  <circle cx="17" cy="12" r="1.2" fill="var(--fg-color)" />
  <circle cx="12" cy="17" r="1.2" fill="var(--fg-color)" />
  <circle cx="7" cy="12" r="1.2" fill="var(--fg-color)" />
</svg>
