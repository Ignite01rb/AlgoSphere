<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    :root {
      --primary-color: hsl(36, 96%, 48%);
      --gradient-mid: hsl(36, 96%, 48% / 0.85);
      --gradient-stop: hsl(36, 96%, 48% / 0.4);
      --fg-color: hsl(30, 50%, 4%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary-color: hsl(37, 90%, 55%);
        --gradient-mid: hsl(37, 90%, 55% / 0.85);
        --gradient-stop: hsl(37, 90%, 55% / 0.4);
        --fg-color: hsl(35, 20%, 96%);
      }
    }
  </style>
  <defs>
    <linearGradient id="tabLogoGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--primary-color)" />
      <stop offset="0.5" stop-color="var(--gradient-mid)" />
      <stop offset="1" stop-color="var(--gradient-stop)" />
    </linearGradient>
    <filter id="tabLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z" stroke="url(#tabLogoGrad)" stroke-width="1.2" stroke-linejoin="round" opacity="0.35" />
  <path d="M12 3 L20 7.5 L20 16.5 L12 21 L4 16.5 L4 7.5 Z" stroke="url(#tabLogoGrad)" stroke-width="1" stroke-linejoin="round" stroke-dasharray="2 2" opacity="0.2" />
  <line x1="12" y1="6" x2="7" y2="11" stroke="url(#tabLogoGrad)" stroke-width="1" opacity="0.4" />
  <line x1="12" y1="6" x2="17" y2="11" stroke="url(#tabLogoGrad)" stroke-width="1" opacity="0.4" />
  <line x1="7" y1="11" x2="12" y2="16" stroke="url(#tabLogoGrad)" stroke-width="1" opacity="0.4" />
  <line x1="17" y1="11" x2="12" y2="16" stroke="url(#tabLogoGrad)" stroke-width="1" opacity="0.4" />
  <line x1="12" y1="6" x2="12" y2="16" stroke="url(#tabLogoGrad)" stroke-width="1.2" opacity="0.6" />
  <path d="M12 6 L17 11 L12 16 L7 11 Z" stroke="url(#tabLogoGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="12" cy="11" r="2.5" fill="url(#tabLogoGrad)" filter="url(#tabLogoGlow)" />
  <circle cx="12" cy="6" r="1.2" fill="var(--fg-color)" />
  <circle cx="17" cy="11" r="1.2" fill="var(--fg-color)" />
  <circle cx="12" cy="16" r="1.2" fill="var(--fg-color)" />
  <circle cx="7" cy="11" r="1.2" fill="var(--fg-color)" />
</svg>
